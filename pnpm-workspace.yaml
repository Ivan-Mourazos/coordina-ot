# pnpm 11 apunta aquí qué módulos nativos pueden ejecutar sus scripts de
# compilación. Estas tres las escribió el propio pnpm al instalar en el
# servidor; van versionadas para que la instalación sea igual en todas partes
# y para que el árbol del servidor no aparezca modificado en cada despliegue.
allowBuilds:
  better-sqlite3: true
  sharp: true
  unrs-resolver: true
onlyBuiltDependencies:
  - better-sqlite3
  - "@napi-rs/canvas"
